[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-nfsim"
version = "0.2.0"
description = "Process-bigraph wrapper for BioNetGen/NFSim rule-based simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=1.9.1",
    "bigraph-schema",
    "bionetgen==0.8.7",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
# Dashboard visualizations (FlagellaAssemblyPlots). Not needed for simulation.
dashboard = ["viva-superpowers"]
dev = ["pytest", "bigraph-viz"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_nfsim*"]

[tool.setuptools.package-data]
pbg_nfsim = ["models/*.bngl", "composites/*.composite.yaml"]
