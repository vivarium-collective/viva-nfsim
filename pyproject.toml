[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-nfsim"
version = "0.1.0"
description = "Process-bigraph wrapper for BioNetGen/NFSim rule-based simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "viva-superpowers",
    "bionetgen",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_nfsim*"]
